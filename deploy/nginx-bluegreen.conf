# Blue/green load-balancer config for the on-premises production target (ADR-0002).
# The `app_backend` upstream holds both fleets; scripts/bluegreen-deploy.sh shifts traffic
# by rewriting this file into deploy/nginx-bluegreen.runtime.conf and reloading nginx —
# the stand-in for an ALB weighted target-group shift.
#
# NOTE: NGINX has no weight=0. A fleet at 0% traffic is marked `down` (removed from the
# roster) instead; a fleet at N% uses weight=N. This file is the build-time default
# (blue 100%, green out of rotation); the runtime copy carries the live weights.

# Docker's embedded DNS; nginx re-resolves fleet addresses every valid=10s, so a
# recreated container (new IP) is picked up without a reload. The `resolve` parameter
# requires nginx >= 1.27.3 (pinned in deploy/nginx-lb/Dockerfile) and a shared `zone`.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream app_backend {
    zone app_backend 64k;
    server blue:8081 max_fails=3 fail_timeout=10s weight=100 resolve;   # blue (current) — default 100%
    server green:8082 max_fails=3 fail_timeout=10s down resolve;        # green (next) — out of rotation

    # Cache idle upstream connections (passive health checks above mark a fleet down
    # after 3 failures within 10s). On nginx < 1.29.7 keepalive is OFF by default;
    # requires proxy_http_version 1.1 + an empty Connection header below.
    keepalive 32;
}

server {
    listen 8080;

    location = /actuator/health/readiness {
        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location / {
        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        # Retry only transport-level failures on the next fleet; never retry after a
        # request has been sent (protects non-idempotent POSTs from duplication).
        proxy_next_upstream error timeout;
    }
}
