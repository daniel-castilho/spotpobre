# Production configuration contract (Twelve-Factor factor 3 — config from environment).
#
# Activate with `SPRING_PROFILES_ACTIVE=prod`. Every value below MUST come from the
# environment (relaxed binding: JWT_SECRET, AWS_REGION, ...). If a required variable is
# undefined, Spring fails at startup with "Could not resolve placeholder '...'" — the app
# refuses to boot on missing/insecure configuration instead of silently using dev defaults.
#
# Never put real values here and never fall back to the dev defaults in application.yaml.

spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

aws:
  region: ${AWS_REGION}
  # Credential source (ADR-0002). AWS_CREDENTIALS_SOURCE selects how production obtains
  # AWS credentials — the ProdConfigValidator enforces coherence at startup:
  #   static             → on-premises LocalStack target: dummy keys REQUIRED below
  #                        (emulated AWS has no IAM).
  #   workload-identity  → real AWS target (ADR-0001 path): keys must be UNSET; the SDK
  #                        default chain resolves the task/instance role.
  credentials:
    source: ${AWS_CREDENTIALS_SOURCE}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
  dynamodb:
    endpoint: ${AWS_DYNAMODB_ENDPOINT}
  s3:
    endpoint: ${AWS_S3_ENDPOINT}
    bucket-name: ${AWS_S3_BUCKET_NAME}

jwt:
  # Required in prod: a strong, long random secret (e.g. `openssl rand -base64 48`).
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:1h}

email:
  # Outbound e-mail contract: SES via the LocalStack edge on the compose network.
  # EMAIL_FROM_ADDRESS must be a verified identity (seed-localstack.sh verifies it).
  from-address: ${EMAIL_FROM_ADDRESS}
  ses-endpoint: ${EMAIL_SES_ENDPOINT}

rate-limit:
  # Redis token-bucket authority (spec section 8). RATE_LIMIT_KEY_SECRET is REQUIRED in prod
  # (fail-fast via ProdConfigValidator); generate with `openssl rand -base64 48`.
  enabled: ${RATE_LIMIT_ENABLED:true}
  key-secret: ${RATE_LIMIT_KEY_SECRET}
  register-ip-capacity: ${RATE_LIMIT_REGISTER_IP_CAPACITY:20}
  register-email-capacity: ${RATE_LIMIT_REGISTER_EMAIL_CAPACITY:5}
  authenticate-ip-capacity: ${RATE_LIMIT_AUTHENTICATE_IP_CAPACITY:100}
  authenticate-email-capacity: ${RATE_LIMIT_AUTHENTICATE_EMAIL_CAPACITY:10}
  upload-initiate-user-capacity: ${RATE_LIMIT_UPLOAD_INITIATE_USER_CAPACITY:20}
  upload-initiate-album-capacity: ${RATE_LIMIT_UPLOAD_INITIATE_ALBUM_CAPACITY:40}
  upload-confirm-user-capacity: ${RATE_LIMIT_UPLOAD_CONFIRM_USER_CAPACITY:60}
  upload-confirm-album-capacity: ${RATE_LIMIT_UPLOAD_CONFIRM_ALBUM_CAPACITY:120}
  search-capacity: ${RATE_LIMIT_SEARCH_CAPACITY:120}
  resend-cooldown-capacity: ${RATE_LIMIT_RESEND_COOLDOWN_CAPACITY:1}
  resend-cooldown-window: ${RATE_LIMIT_RESEND_COOLDOWN_WINDOW:2m}
  trusted-proxy-cidrs: ${RATE_LIMIT_TRUSTED_PROXY_CIDRS:10.0.0.0/8}
# --- Operational exposure lockdown (spec section 11) ------------------------------------
# Management plane moves to the internal-only port 9090 (locked topology decision,
# overriding the spec's "default 8081" wording): health-only, no details, no swagger.
management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
