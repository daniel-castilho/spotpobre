spring:
  application:
    name: Spotpobre

  lifecycle:
    timeout-per-shutdown-phase: 30s

  data:
    redis:
      host: localhost
      port: 6379

server:
  shutdown: graceful

aws:
  region: us-east-1
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID:test}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test}
  dynamodb:
    endpoint: http://localhost:4566
  s3:
    endpoint: http://localhost:4566
    bucket-name: spotpobre-songs

spotpobre:
  uploads:
    reconciliation-enabled: true
    reconciliation-interval-ms: 3600000 # hourly bounded cleanup pass
    reconciliation-initial-delay-ms: 120000

jwt:
  # WARNING: use a strong, long secret in production, managed via environment variables.
  # This value is only an example — generate your own.
  secret: "635266556A586E3272357538782F413F4428472B4B6250655368566D59713374"

  # Named 'expiration' (not 'expiration-ms') to match the 'Duration expiration' field on
  # JwtProperties; the value uses Spring Boot's standard Duration format ('1h' = 1 hour).
  expiration: 1h

rate-limit:
  # Redis token-bucket authority (spec section 8). Dev-only key secret; production MUST
  # override via RATE_LIMIT_KEY_SECRET (validated by ProdConfigValidator).
  enabled: true
  key-secret: ${RATE_LIMIT_KEY_SECRET:dev-only-rate-limit-secret-not-for-production}
  register-ip-capacity: 20
  register-email-capacity: 5
  authenticate-ip-capacity: 100
  authenticate-email-capacity: 10
  upload-initiate-user-capacity: 20
  upload-initiate-album-capacity: 40
  upload-confirm-user-capacity: 60
  upload-confirm-album-capacity: 120
  search-capacity: 120
  resend-cooldown-capacity: 1
  resend-cooldown-window: 2m
  anonymous-policies-paths:
    - /api/v1/auth/register
    - /api/v1/auth/authenticate
  search-path: /api/v1/songs/search
  trusted-proxy-cidrs:
    - 127.0.0.0/8
    - ::1/128
  client-ip-header: X-Forwarded-For

email:
  # SES identity used as the From header; must be verified in production.
  from-address: ${EMAIL_FROM_ADDRESS:no-reply@spotpobre.local}
  ses-endpoint: ${EMAIL_SES_ENDPOINT:http://localhost:4566}
  verification-ttl: ${EMAIL_VERIFICATION_TTL:24h}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics # Expose common endpoints
  endpoint:
    health:
      show-details: when-authorized # Probe endpoints stay light; details only for authenticated clients
      probes:
        enabled: true # Expose /actuator/health/liveness and /actuator/health/readiness
      group:
        # Readiness gates on the critical dependencies (S6 health model):
        # DynamoDB and S3. Redis is a cache and is reported separately on /actuator/health
        # but is not gating: a transient Redis outage degrades caching, not serving.
        readiness:
          include: readinessState,dynamoDb,s3
        liveness:
          include: livenessState
