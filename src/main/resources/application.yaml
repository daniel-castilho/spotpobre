spring:
  application:
    name: Spotpobre

  lifecycle:
    timeout-per-shutdown-phase: 30s

  data:
    redis:
      host: localhost
      port: 6379

server:
  shutdown: graceful

aws:
  region: us-east-1
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID:test}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test}
  dynamodb:
    endpoint: http://localhost:4566
  s3:
    endpoint: http://localhost:4566
    bucket-name: spotpobre-songs

jwt:
  # ATENÇÃO: Use uma chave secreta forte e longa em produção, gerenciada via variáveis de ambiente.
  # Este é apenas um exemplo. Gere a sua própria chave.
  secret: "635266556A586E3272357538782F413F4428472B4B6250655368566D59713374"

  # CORREÇÃO: A propriedade foi renomeada de 'expiration-ms' para 'expiration'
  # para corresponder ao campo 'Duration expiration' na classe JwtProperties.
  # O valor foi alterado para o formato de Duração padrão do Spring Boot ('1h' = 1 hora).
  expiration: 1h

rate-limit:
  # Basic per-client throttling on sensitive endpoints (default: auth). Dev defaults;
  # production overrides via RATE_LIMIT_* environment variables (see application-prod.yaml).
  enabled: true
  limit: 20
  window: 1m
  paths:
    - /api/v1/auth/register
    - /api/v1/auth/authenticate
  client-ip-header: X-Forwarded-For

email:
  # SES identity used as the From header; must be verified in production.
  from-address: ${EMAIL_FROM_ADDRESS:no-reply@spotpobre.local}
  ses-endpoint: ${EMAIL_SES_ENDPOINT:http://localhost:4566}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics # Expose common endpoints
  endpoint:
    health:
      show-details: when-authorized # Probe endpoints stay light; details only for authenticated clients
      probes:
        enabled: true # Expose /actuator/health/liveness and /actuator/health/readiness
      group:
        # Readiness gates on the critical dependencies (S6 health model):
        # DynamoDB and S3. Redis is a cache and is reported separately on /actuator/health
        # but is not gating: a transient Redis outage degrades caching, not serving.
        readiness:
          include: readinessState,dynamoDb,s3
        liveness:
          include: livenessState
