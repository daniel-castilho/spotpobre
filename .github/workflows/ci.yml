name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write   # SARIF upload from Trivy
  packages: write          # ECR/docker registry push (when enabled via OIDC)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Unit tests
        run: ./mvnw test

      - name: JaCoCo coverage check
        if: success()
        run: ./mvnw jacoco:check

      - name: SpotBugs static analysis
        if: success()
        run: ./mvnw spotbugs:check

      # Seeds/persists the NVD mirror so Dependency Check applies deltas
      # instead of re-downloading ~380k records on every run. Bump the key
      # suffix to force a full refresh.
      - name: Cache OWASP Dependency Check NVD mirror
        if: success()
        uses: actions/cache@v6
        with:
          path: ~/.m2/dependency-check-data
          key: dependency-check-nvd-v1

      - name: OWASP Dependency Check
        if: success()
        env:
          # Repository secret — without a key the NVD throttles updates into
          # hours-long full downloads.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        # Vulnerability policy lives in the POM (failBuildOnCVSS=11 +
        # failOnError=false): findings are report-only and an unreachable NVD
        # degrades to the cached mirror instead of failing CI.
        run: ./mvnw dependency-check:check

      - name: Slice + E2E tests (Docker / Testcontainers)
        if: success()
        run: ./mvnw test -Dtest='*IT' -DfailIfNoTests=false

      - name: Production build
        if: success()
        run: ./mvnw clean package

      - name: Upload production jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: spotpobre-api-jar
          path: target/spotpobre-*.jar

  # S13 — build the production image and verify its supply-chain hygiene.
  image:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: |
          IMAGE="spotpobre-api:${{ github.sha }}"
          docker build -t "$IMAGE" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          # Record the immutable image ID so the same reference can be deployed/rolled back.
          # (.RepoDigests is empty for locally built, un-pushed images.)
          docker inspect --format='{{.Id}}' "$IMAGE" > image-digest.txt
          cat image-digest.txt

      - name: Non-root check (must fail on UID 0)
        run: |
          out="$(docker run --rm --entrypoint id "$IMAGE")"
          echo "$out"
          if echo "$out" | grep -q 'uid=0('; then
            echo "FATAL: image runs as root (UID 0)"
            exit 1
          fi
          echo "OK: image runs as non-root ($out)"

      # trivy-action's built-in caching wraps an old node20-pinned actions/cache;
      # keep the daily-seeded behavior on our own supported runtime instead
      # (first run of the day seeds the DBs, later runs restore them).
      - name: Compute Trivy cache day
        id: trivy-day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy vulnerability databases
        uses: actions/cache@v6
        with:
          path: .cache/trivy
          key: trivy-db-${{ steps.trivy-day.outputs.day }}

      # aquasecurity/trivy-action v0.36.0 (plain tags like 0.30.0 do not exist; only v-prefixed do)
      # Report pass: full SARIF for the Security tab advisory trail. In sarif
      # mode trivy-action ignores the severity filter for both output AND
      # exit-code (aquasecurity/trivy-action#309), so this step must not gate.
      - name: Trivy vulnerability report (all severities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: spotpobre-api:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          cache: false

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

      # Gate pass: table format respects the severity filter, so exit-code '1'
      # fires only on fixable HIGH/CRITICAL findings — the actual policy.
      # Reuses the Trivy DBs cached above within the same job.
      - name: Trivy vulnerability gate (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: spotpobre-api:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          cache: false

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: spotpobre-api:${{ github.sha }}
          format: cyclonedx
          output: sbom.cdx.json
          cache: false

      - name: Upload SBOM + image digest
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sbom
          path: |
            sbom.cdx.json
            image-digest.txt

  # S13 — runtime shutdown smoke. Non-blocking: exercises graceful drain under load
  # against LocalStack + Redis. Gated by the image-build path is intentionally NOT
  # applied (see testing-playbook gap 7: shutdown test has no CI gate yet).
  runtime-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start external services (LocalStack + Redis)
        run: docker compose up -d

      - name: Wait for LocalStack readiness (DynamoDB + S3)
        run: |
          for i in $(seq 1 30); do
            if AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test AWS_DEFAULT_REGION=us-east-1 \
                 aws --endpoint-url=http://localhost:4566 dynamodb list-tables >/dev/null 2>&1 \
               && AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test AWS_DEFAULT_REGION=us-east-1 \
                 aws --endpoint-url=http://localhost:4566 s3api list-buckets >/dev/null 2>&1; then
              echo "LocalStack DynamoDB and S3 are ready"
              exit 0
            fi
            sleep 2
          done

          docker compose logs localstack
          echo "LocalStack DynamoDB/S3 did not become ready"
          exit 1

      - name: Provision DynamoDB schema + S3 bucket
        run: ./scripts/seed-localstack.sh

      - name: Download production jar
        uses: actions/download-artifact@v7
        with:
          name: spotpobre-api-jar
          path: target/

      - name: Graceful shutdown under load
        run: |
          set +e
          JAR="$(ls target/spotpobre-*.jar | head -1)"
          scripts/shutdown-under-load-test.sh "$JAR" 8080 40
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "::warning::Shutdown smoke failed (exit $rc); non-blocking per current gate policy."
          fi

      - name: Stop external services
        if: always()
        run: docker compose down
